<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Brand Dominance Keywords Optimization -->
    <title>Velora Platform | Official App Login &amp; Registration</title>
    <meta name="description" content="Access the official Velora Platform. Register your account to activate your dashboard, view premium tier packages, or secure your Velora login to start instantly." />
    <meta name="keywords" content="Velora, Velora platform, Velora login, Velora registration, Velora app,Velora website" />
    <link rel="canonical" href="https://velora-platform.vercel.app/" /> <!-- ◄ FIXED: Added trailing slash -->

    <!-- Open Graph (Facebook/WhatsApp Status Display Metrics) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Velora Platform | Official Registration &amp; Secure Login" />
    <meta property="og:description" content="Join the Velora platform. Secure your instant account registration or login to view your active user tier dashboard." />
    <meta property="og:url" content="https://velora-platform.vercel.app/" /> <!-- ◄ FIXED: Added trailing slash -->
    <meta property="og:image" content="https://velora-platform.vercel.app/hero.png" />

    <!-- Search Engine Crawler Validation Flags -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    
    <!-- Organization Schema Markup (JSON-LD Entity Creation) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Velora",
        "url": "https://velora-platform.vercel.app/", 
        "logo": "https://velora-platform.vercel.app/logo.png",
        "description": "Velora is a modern software platform providing tiered packages and digital account dashboard services.",
        "potentialAction": {
          "@type": "AuthorizeAction",
          "target": "https://velora-platform.vercel.app/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
